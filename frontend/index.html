<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

</head>

<body>
  <!-- 1. Navbar -->
  <header>
    <nav id="mainNavbar" class="navbar bg-dark border-bottom border-body text-white" data-bs-theme="dark">
      <div class="container ps-3 ps-lg-5 p-2 d-flex justify-content-between">
        <h4 class="navbar-brand mb-0 text-reset">Expense Tracker</h4>
        <div>
          <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm">
            <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
          </button>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <div class="container p-3 p-lg-5">

      <!-- spinner -->
      <div id="loadingSpinner" class="text-center d-none my-3">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>


      <!-- Alert -->
      <div id="errorAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
        <span id="alertMessage"></span>
        <button type="button" class="btn-close" onclick="hideAlert()" aria-label="Close"></button>
      </div>

      <!-- 2. Summary cards: total amount, number of expenses, highest expense -->

      <div class="grid text-center mb-4" style="--bs-gap: 1rem;">
        <!-- Card 1 -->
        <div class="g-col-12 g-col-md-4 card p-3 shadow-sm">
          <small class="text-secondary mb-1 fs-6">Total</small>
          <h3 class="fw-bold m-0 fs-4" id="totalAmount">0.00</h3>
        </div>

        <!-- Card 2 -->
        <div class="g-col-12 g-col-md-4 card p-3 shadow-sm">
          <small class="text-secondary fs-6 mb-1">Number of expenses</small>
          <h3 class="fw-bold m-0 fs-4" id="numberOfExpenses">0</h3>
        </div>

        <!-- Card 3 -->
        <div class="g-col-12 g-col-md-4 card p-3 shadow-sm">
          <small class="text-secondary fs-6 mb-1">Highest expense</small>
          <h3 class="fw-bold m-0 fs-4" id="highestExpenseAmount">0.00</h3>
          <small class="text-secondary fs-6 mt-1" id="highestExpenseTitle">-</small>
        </div>
      </div>


      <!-- 3. Form to add an expense: title, amount, category (select), date -->
      <div class="card p-3 mb-4 shadow-sm">
        <div>
          <h5 class="mb-3">Add Expenses</h5>
        </div>
        <form id="expenseForm" class="mb-3" novalidate>
          <div class="row">
            <!-- Title -->
            <div class="mb-3 col-lg-4 col-8">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title" placeholder="Lunch" required>
              <div class="invalid-feedback">Title is required.</div>
            </div>

            <!-- Amount -->
            <div class="mb-3 col-4 col-lg-2">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="amount" placeholder="30.50" required>
              <div class="invalid-feedback">Enter an amount greater than 0.</div>
            </div>

            <!-- Category -->
            <div class="mb-3 col-6 col-lg-3">
              <label for="category" class="form-label">Category</label>
              <select id="category" name="category" class="form-select" required>
                <option value="">Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback">Choose a Category.</div>
            </div>

            <!-- Date -->
            <div class="mb-3 col-6 col-lg-3">
              <label for="date" class="form-label">Date</label>
              <input type="date" class="form-control" id="date" required>
              <div class="invalid-feedback">Date is required.</div>
            </div>
          </div>

          <button type="submit" id="addBtn" class="btn btn-primary">Add Expenses</button>
        </form>
      </div>

      <!-- 4. Filter by category -->

      <div class="card p-3 mb-3 shadow-sm">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center mb-3">
          <div>
            <h5>Expenses</h5>
          </div>
          <div class="d-inline-flex align-items-center gap-2">
            <label for="categoryFilter" class=" mb-0">Category:</label>
            <select id="categoryFilter" name="category" class="form-select form-select-sm">
              <option value="all">All Categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <!--  5. Table -->

        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>Title</th>
                <th class="text-end" style="min-width: 90px;">Amount</th>
                <th>Category</th>
                <th style="min-width: 110px;">Date</th>
                <th class="text-end" style="min-width: 130px;">Actions</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody"></tbody>
          </table>
        </div>
        <div class=" m-1 d-flex gap-1 justify-content-end">
          <button id="exportCsvBtn" class="btn btn-outline-success btn-sm">
            Export to CSV
          </button>
          <button id="deleteAll" class="btn btn-outline-danger btn-sm">
            Delete All
          </button>
        </div>
      </div>
      <div id="chartCard" class="card p-3 shadow-sm mb-4 d-none">
        <h5 class="card-title mb-3">Expenses Breakdown</h5>
        <div style="max-height: 300px;" class="d-flex justify-content-center">
          <canvas id="expensesChart"></canvas>
        </div>
      </div>
    </div>

  </main>

   <!--  update modal -->
  <div class="modal" tabindex="-1" id="update">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">update Expenses</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body " id="modal-body">

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/bonus.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
